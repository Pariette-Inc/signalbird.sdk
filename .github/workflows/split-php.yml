name: PHP ayna reposu

# Packagist composer.json'ı repo KÖKÜNDE ister; monorepo alt klasörü doğrudan
# yayınlanamaz. Bu workflow packages/php'yi salt-okunur bir ayna repoya kopyalar
# (Laravel/Symfony deseni). Ayna repo elle düzenlenmez — kaynak burasıdır.
#
# Gereken kurulum (bir kereliğine):
#   1. Pariette-Inc/signalbird.php.sdk reposunu aç (boş, public).
#   2. Bu repoda SPLIT_TOKEN secret'ını tanımla — hedef repoya yazma yetkisi olan
#      bir PAT (fine-grained: Contents read/write).
#   3. Packagist'te signalbird/sdk paketini AYNA repo adresiyle kaydet.

on:
  push:
    branches: [main]
    paths: ['packages/php/**']
  create:

jobs:
  split:
    # Etiket olayında yalnızca sürüm etiketlerinde çalış
    if: github.event_name == 'push' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ayna dalını üret
        id: split
        run: |
          git config user.name  "signalbird-bot"
          git config user.email "noreply@signalbird.io"
          # packages/php'yi kendi geçmişiyle ayrı bir dala böl
          SHA=$(git subtree split --prefix=packages/php -b php-mirror)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Ayna repoya it
        env:
          TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SPLIT_TOKEN tanımlı değil — ayna repoya yazılamaz."
            exit 1
          fi
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/Pariette-Inc/signalbird.php.sdk.git" \
            php-mirror:main

      - name: Sürüm etiketini aynaya taşı
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          git tag -f "$TAG" "${{ steps.split.outputs.sha }}"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/Pariette-Inc/signalbird.php.sdk.git" \
            "refs/tags/${TAG}"
